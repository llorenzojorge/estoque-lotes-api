services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: estoque-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Sem isto o container roda em UTC: depois das 21h o GETDATE() já estaria no dia seguinte
      # e discordaria do DateTime.Today da API.
      TZ: America/Sao_Paulo
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
